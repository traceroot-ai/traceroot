# TraceRoot Development Infrastructure
#
# Make sure to update the credential placeholders with your own secrets.
# We mark them with # CHANGEME in the file below.
#
# All services are bound to localhost (127.0.0.1) to only accept connections
# from the local machine for security.

services:
  postgres:
    image: docker.io/postgres:${POSTGRES_VERSION:-17}
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}  # CHANGEME
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      TZ: UTC
      PGTZ: UTC
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema managed by Prisma migrations (cd ui && npx prisma migrate dev)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-25.2}
    restart: always
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-default}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}  # CHANGEME
      # Read by sql_gateway_bootstrap_user.xml via from_env, so the password for the
      # only access-management account is never written into a mounted config file.
      SQL_GATEWAY_BOOTSTRAP_PASSWORD: ${SQL_GATEWAY_BOOTSTRAP_PASSWORD:-dev-sql-gateway-bootstrap}
    ports:
      - 127.0.0.1:8123:8123
      - 127.0.0.1:9000:9000
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      # Defines sql_gateway_bootstrap, the only account holding access management.
      # Kept off the application account, which rest/worker/billing/detector all use.
      - ./backend/db/clickhouse/bootstrap/sql_gateway_bootstrap_user.xml:/etc/clickhouse-server/users.d/zz-sql-gateway-bootstrap.xml:ro
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  # One-shot, idempotent: provisions the SQL-gateway DB users. sql_gateway_writer
  # is the DEFINER of the views created by migration 006, so it MUST exist before
  # migrate-clickhouse runs. Uses clickhouse-client against the live server (not the
  # first-boot-only /docker-entrypoint-initdb.d), so it also provisions existing
  # data volumes. See backend/db/clickhouse/bootstrap/sql_gateway_users.sql.
  clickhouse-init:
    image: docker.io/clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-24.3}
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./backend/db/clickhouse/bootstrap/sql_gateway_users.sql:/bootstrap/sql_gateway_users.sql:ro
    # Credentials arrive as environment rather than command arguments, so they stay
    # out of the container's command line and out of `ps`. They are still readable
    # via `docker inspect` and the container config -- that is inherent to compose
    # environment, and anyone with daemon access is already root-equivalent here.
    # The $$ below are escaped for the shell rather than substituted by Compose.
    environment:
      # Provisioning runs as the bootstrap identity, not the application account:
      # CREATE USER and SET DEFINER need access management, which the account the app
      # runs as deliberately does not have.
      CLICKHOUSE_USER: sql_gateway_bootstrap
      CLICKHOUSE_PASSWORD: ${SQL_GATEWAY_BOOTSTRAP_PASSWORD:-dev-sql-gateway-bootstrap}
      # Dev stack: weak known defaults, matching this stack's other credentials.
      SQL_GATEWAY_WRITER_PASSWORD: ${SQL_GATEWAY_WRITER_PASSWORD:-dev-sql-gateway-writer}
      CLICKHOUSE_RO_PASSWORD: ${CLICKHOUSE_RO_PASSWORD:-dev-sql-gateway-ro}
    entrypoint: >
      /bin/sh -c "
      set -e;
      W=$$(printf '%s' \"$$SQL_GATEWAY_WRITER_PASSWORD\" | sha256sum | cut -d' ' -f1);
      R=$$(printf '%s' \"$$CLICKHOUSE_RO_PASSWORD\" | sha256sum | cut -d' ' -f1);
      sed -e \"s/__WRITER_HASH__/$$W/g\" -e \"s/__RO_HASH__/$$R/g\"
      /bootstrap/sql_gateway_users.sql > /tmp/sql_gateway_users.sql;
      clickhouse-client --host clickhouse --port 9000 --user \"$$CLICKHOUSE_USER\"
      --queries-file /tmp/sql_gateway_users.sql
      "
    restart: "no"

  minio:
    image: docker.io/minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-password}  # CHANGEME
    ports:
      - 9090:9000
      - 127.0.0.1:9091:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 1s

  minio-init:
    image: docker.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER:-minio} $${MINIO_ROOT_PASSWORD:-minio-password};
      mc mb myminio/traceroot --ignore-existing;
      exit 0;
      "

  redis:
    image: docker.io/redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate-clickhouse:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrate-clickhouse
    entrypoint:
      - goose
      - -dir
      - /migrations
      - clickhouse
      # Migrations run as the bootstrap identity too: the curated views are created
      # with an explicit DEFINER, and setting a view's definer to another account
      # requires access management, which the application account does not hold.
      - clickhouse://sql_gateway_bootstrap:${SQL_GATEWAY_BOOTSTRAP_PASSWORD:-dev-sql-gateway-bootstrap}@clickhouse:9000/${CLICKHOUSE_DATABASE:-default}
    command: ["up"]
    depends_on:
      clickhouse:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully
    restart: "no"

volumes:
  postgres_data:
    driver: local
  clickhouse_data:
    driver: local
  clickhouse_logs:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local
