name: Publish @traceroot-ai/tools

# The tool registry is generated from the public OpenAPI schema and consumed by
# traceroot-cli as a published dependency, so it has its own version, separate
# from the vX.Y.Z platform releases.
#
# It publishes silently: no git tag, no GitHub Release, no Discord post. Tags
# and releases in this repo belong to the platform only (a non-v tag on main
# also became the platform version label in the web UI).
#
# To release: bump "version" in frontend/packages/tools/package.json, add a
# CHANGELOG.md entry, and merge the PR. This workflow publishes on merge when
# that version is not on npm yet. See frontend/packages/tools/README.md.
on:
  push:
    branches: [main]
    paths:
      - frontend/packages/tools/package.json
  # Re-run a publish after a workflow fix. Publishes main's version, if unpublished.
  workflow_dispatch:

concurrency:
  # Per commit, so a manual re-run never races the push run for the same
  # version, while bumps merged back to back still each get their own run.
  group: publish-tools-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    # A manual run from any other branch must not publish.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      # Most pushes that touch package.json are not version bumps. Publish only
      # when this version is missing from npm (E404); fail on any other error
      # rather than guessing.
      - name: Check whether this version is already published
        id: check
        run: |
          VERSION=$(node -p "require('./frontend/packages/tools/package.json').version")
          if out=$(npm view "@traceroot-ai/tools@$VERSION" version 2>&1); then
            echo "::notice::@traceroot-ai/tools@$VERSION is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$out" | grep -q E404; then
            echo "::notice::@traceroot-ai/tools@$VERSION is not on npm yet; publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$out"
            echo "::error::could not check npm for @traceroot-ai/tools@$VERSION"
            exit 1
          fi

  publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # The pnpm version is pinned by the frontend workspace's packageManager
          # field; the repo root has none, so point the action at it.
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Trusted publishing needs npm >= 11.5.1. Pinned to the 11 line rather
      # than @latest: npm 12 requires Node ^22.22.2 and broke a publish here
      # the day it shipped.
      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Build
        run: cd frontend/packages/tools && pnpm build

      - name: Test
        run: cd frontend/packages/tools && pnpm test

      # No token: npm verifies over OIDC that this run came from this repo and
      # workflow. Published with npm rather than pnpm because pnpm's publish
      # does not perform the OIDC exchange; safe because this package declares
      # no dependencies at all.
      - name: Publish
        run: npm publish --provenance --access public
        working-directory: frontend/packages/tools
