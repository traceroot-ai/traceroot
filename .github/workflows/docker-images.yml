# .github/workflows/docker-images.yml
# Builds and pushes Docker images to ECR.
# Triggered manually or on a schedule — NOT on every push.
# Build validation (build-test.yml) runs on every push/PR to catch errors early.
name: Build & Push Docker Images

on:
  # schedule:
  #   # Daily at 3am — disabled until we have a use for it
  #   - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target ECR repo prefix (repos are named traceroot-<environment>-<service>)"
        type: choice
        options:
          - staging
          - production
        default: staging

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write      # mint the OIDC token used to assume the ECR push role

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 965747688757.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build-and-push:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            dockerfile: docker/Dockerfile.web
          - service: rest
            dockerfile: docker/Dockerfile.rest
          - service: worker
            dockerfile: docker/Dockerfile.worker
          - service: billing
            dockerfile: docker/Dockerfile.billing
          - service: agent
            dockerfile: docker/Dockerfile.agent
          - service: detector
            dockerfile: docker/Dockerfile.detector
          - service: migrate-clickhouse
            dockerfile: docker/Dockerfile.migrate-clickhouse
          - service: migrate-postgres
            dockerfile: docker/Dockerfile.migrate-postgres

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          # Short-lived credentials minted per run via GitHub OIDC. The role can
          # push to traceroot-* ECR repositories and nothing else; there is no
          # stored AWS key to leak.
          role-to-assume: arn:aws:iam::965747688757:role/traceroot-build-ecr
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Only vX.Y.Z tags are platform versions; other tags must not become the label.
      - name: Resolve app version
        id: app_version
        run: echo "value=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.ECR_REGISTRY }}/traceroot-${{ inputs.environment }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-environment build args. NEXT_PUBLIC_APP_URL and BETTER_AUTH_URL
          # are inlined into the web client bundle at BUILD time (Next.js) and
          # default to http://localhost:3000 in docker/Dockerfile.web — if they
          # are not passed, login breaks in the deployed env. They are public,
          # deterministic per-env URLs (not secrets), so derive them from the
          # `environment` input rather than a deletable GitHub secret. PostHog
          # is production-only (empty -> dropped by build-push-action -> the
          # Dockerfile default of "" -> analytics disabled, as on staging).
          build-args: |
            APP_VERSION=${{ steps.app_version.outputs.value }}
            NEXT_PUBLIC_APP_URL=${{ inputs.environment == 'production' && 'https://app.traceroot.ai' || 'https://staging.traceroot.ai' }}
            BETTER_AUTH_URL=${{ inputs.environment == 'production' && 'https://app.traceroot.ai' || 'https://staging.traceroot.ai' }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ inputs.environment == 'production' && secrets.NEXT_PUBLIC_POSTHOG_KEY || '' }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ inputs.environment == 'production' && secrets.NEXT_PUBLIC_POSTHOG_HOST || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
