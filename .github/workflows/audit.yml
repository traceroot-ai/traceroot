name: Dependency Audit

# Fails a pull request when a locked dependency carries a known advisory, so
# the OpenSSF scorecard's vulnerability count cannot creep back up unnoticed.
# Advisories that genuinely cannot be fixed here are allowlisted next to their
# reason: frontend/pnpm-workspace.yaml (auditConfig.ignoreGhsas) for npm, and
# the --ignore-vuln flags below for Python.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # New advisories land without a code change; re-check main weekly.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  npm:
    name: npm audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Audit lockfile
        run: cd frontend && pnpm audit --audit-level moderate

  python:
    name: pip-audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Export locked requirements
        run: uv export --all-extras --all-groups --no-hashes --no-emit-project --frozen -o requirements-audit.txt

      - name: Audit lockfile
        run: uvx pip-audit --requirement requirements-audit.txt --no-deps --strict
