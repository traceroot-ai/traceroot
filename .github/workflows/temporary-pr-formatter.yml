name: Temporary PR formatter

on:
  push:
    branches:
      - fix/stripe-meter-event-outbox
    paths:
      - .github/workflows/temporary-pr-formatter.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install repository dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Format the three changed billing files
        run: >-
          cd frontend && pnpm exec prettier --write
          worker/src/ee/billing/__tests__/stripeMeterOutbox.test.ts
          worker/src/ee/billing/stripeMeterOutbox.ts
          worker/src/ee/billing/usageMetering.ts

      - name: Commit formatting changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/worker/src/ee/billing/__tests__/stripeMeterOutbox.test.ts
          git add frontend/worker/src/ee/billing/stripeMeterOutbox.ts
          git add frontend/worker/src/ee/billing/usageMetering.ts
          if git diff --cached --quiet; then
            echo "The billing files are already formatted."
          else
            git commit -m "style(billing): apply repository Prettier formatting"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
