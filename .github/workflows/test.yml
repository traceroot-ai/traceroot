name: Tests

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lint
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  # ---------------------------------------------------------------------------
  # Backend unit tests  (tests/)
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-24.04
    needs: [lint]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run backend tests with coverage
        timeout-minutes: 15
        run: |
          uv run coverage run -m pytest tests/ --durations=10
          uv run coverage xml -o coverage-backend.xml
          uv run coverage report

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-backend
          path: coverage-backend.xml

  # ---------------------------------------------------------------------------
  # SQL gateway against a live ClickHouse  (tests/integration/)
  # ---------------------------------------------------------------------------
  # The suite skips without a server, so in backend-tests it proves nothing. This job
  # gives it one: the same major version the compose stack defaults to, with an admin
  # that can create the gateway's accounts and set its views' DEFINER.
  sql-gateway-integration:
    name: SQL Gateway Integration
    runs-on: ubuntu-24.04
    needs: [lint]

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:25.2
        env:
          CLICKHOUSE_USER: it
          CLICKHOUSE_PASSWORD: it
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run SQL gateway integration tests
        timeout-minutes: 10
        env:
          SQL_GATEWAY_IT_CLICKHOUSE_HOST: localhost
          SQL_GATEWAY_IT_CLICKHOUSE_PORT: "8123"
          SQL_GATEWAY_IT_CLICKHOUSE_USER: it
          SQL_GATEWAY_IT_CLICKHOUSE_PASSWORD: it
          SQL_GATEWAY_IT_REQUIRED: "1"
        run: uv run pytest tests/integration -m integration

  # ---------------------------------------------------------------------------
  # Frontend unit tests  (frontend/)
  # ---------------------------------------------------------------------------
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-24.04
    needs: [lint]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Docs regression tests
        run: node --test tests/docs-*.test.mjs

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: cd frontend/packages/core && pnpm db:generate

      # The agent package resolves @traceroot-ai/tools through its compiled
      # dist (exports map), so the tools package must be built before any
      # dependent package's tests run.
      - name: Build tools package
        run: cd frontend/packages/tools && pnpm build

      - name: Run frontend tests with coverage
        timeout-minutes: 15
        run: |
          set -euo pipefail

          # Run test:coverage in each package
          cd frontend

          FAIL=0
          for pkg in ui worker packages/core ee/agent packages/slack packages/github packages/tools; do
            echo "::group::test:coverage — $pkg"
            cd "$pkg"
            pnpm test:coverage || FAIL=1
            cd -
            echo "::endgroup::"
          done

          if [ "$FAIL" -eq 1 ]; then
            echo "::error::One or more frontend test suites failed."
            exit 1
          fi

      - name: Fix lcov source paths and merge
        if: always()
        run: |
          set -euo pipefail

          # Vitest writes SF: paths relative to the package root (e.g. src/lib/utils.ts).
          # diff-cover needs repo-root paths (e.g. frontend/ui/src/lib/utils.ts).
          # Fix each package's lcov and concatenate into one file.

          PACKAGES=(
            "frontend/ui"
            "frontend/worker"
            "frontend/packages/core"
            "frontend/ee/agent"
            "frontend/packages/slack"
            "frontend/packages/github"
            "frontend/packages/tools"
          )

          > coverage-frontend.lcov  # truncate / create

          for pkg in "${PACKAGES[@]}"; do
            lcov_file="$pkg/coverage/lcov.info"
            if [ -f "$lcov_file" ]; then
              echo "Fixing paths in $lcov_file (prefix: $pkg/)"
              sed -i "s|^SF:|SF:${pkg}/|g" "$lcov_file"
              cat "$lcov_file" >> coverage-frontend.lcov
            else
              echo "::error::No coverage file found for $pkg. This will bypass the coverage gate for changed files in this package."
              exit 1
            fi
          done

          echo "Merged frontend lcov lines: $(wc -l < coverage-frontend.lcov)"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-frontend
          path: coverage-frontend.lcov

  # ---------------------------------------------------------------------------
  # Agent self-trace contract  (tests/e2e/test_agent_trace_contract.py)
  #
  # The one automated guard that an internal (agent / detector) trace never
  # reaches a customer surface or the customer's usage bucket. It needs a live
  # REST over migrated Postgres + ClickHouse + Redis, so it runs here rather
  # than in backend-tests: infra from docker-compose.yml, REST from source, and
  # tests/e2e/stub_key_validator.py standing in for the UI's key-resolution
  # route (which has its own unit tests). No image is built.
  # ---------------------------------------------------------------------------
  agent-trace-contract:
    name: Agent Trace Contract
    runs-on: ubuntu-24.04
    needs: [lint]
    timeout-minutes: 20
    env:
      TRACEROOT_E2E_PROJECT_ID: 00000000-0000-4000-8000-00000000e2e0
      # The dev compose file's own defaults; the database exists for this job only.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      ENABLE_BILLING: "false"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Minted per run rather than written down: nothing here outlives the job,
      # and a literal in the workflow reads like a secret to every scanner that
      # sees it (and to the next person who copies it somewhere that matters).
      - name: Mint this run's credentials
        run: |
          set -euo pipefail
          {
            echo "INTERNAL_API_SECRET=$(openssl rand -hex 32)"
            echo "TRACEROOT_E2E_API_KEY=tr-$(uuidgen | tr "[:upper:]" "[:lower:]")"
          } >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies (Prisma)
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Start Postgres, ClickHouse and Redis
        run: docker compose up -d --wait postgres clickhouse redis

      - name: Migrate Postgres
        run: cd frontend/packages/core && pnpm exec prisma migrate deploy

      - name: Check project ingestion timestamps
        env:
          PROJECT_INGESTION_TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: uv run pytest tests/integration/test_project_ingestion.py -v

      - name: Migrate ClickHouse
        run: docker compose run --rm migrate-clickhouse up

      - name: Start the key-resolution stub and REST
        run: |
          set -euo pipefail
          # The stub verifies a digest, so it is given one — never the key.
          export TRACEROOT_E2E_API_KEY_SHA256="$(printf '%s' "$TRACEROOT_E2E_API_KEY" | sha256sum | cut -d' ' -f1)"
          # Run the services from the synced environment so uv does not hold its cache lock.
          nohup .venv/bin/python tests/e2e/stub_key_validator.py 3999 > stub.log 2>&1 &
          TRACEROOT_UI_URL=http://localhost:3999 \
            nohup .venv/bin/uvicorn rest.main:app --host 127.0.0.1 --port 8000 > rest.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/health > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8000/health

      - name: Run the contract test
        env:
          TRACEROOT_E2E: "1"
          TRACEROOT_REST_URL: http://localhost:8000
          TRACEROOT_CH_URL: http://localhost:8123/?user=clickhouse&password=clickhouse
          TRACEROOT_REDIS_URL: redis://localhost:6379/0
        run: uv run pytest tests/e2e/test_agent_trace_contract.py -v

      - name: Service logs
        if: failure()
        run: |
          echo "::group::REST"; cat rest.log; echo "::endgroup::"
          echo "::group::stub"; cat stub.log; echo "::endgroup::"
          docker compose logs --tail=100 clickhouse postgres redis

  # ---------------------------------------------------------------------------
  # Postgres tests
  # The *.db.test.ts files run against a migrated Postgres from
  # docker-compose.yml; without TEST_DATABASE_URL they skip.
  # ---------------------------------------------------------------------------
  postgres-tests:
    name: Postgres Tests
    runs-on: ubuntu-24.04
    needs: [lint]
    timeout-minutes: 15
    env:
      # The dev compose file's own defaults; the database exists for this job only.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Start Postgres
        run: docker compose up -d --wait postgres

      - name: Migrate Postgres
        run: cd frontend/packages/core && pnpm exec prisma migrate deploy

      # Coverage goes to coverage-postgres/, apart from the unit tests' coverage/.
      - name: Run core's Postgres tests
        run: |
          cd frontend/packages/core
          pnpm exec prisma generate
          pnpm exec vitest run .db.test.ts --coverage --coverage.reportsDirectory=./coverage-postgres

      - name: Fix lcov source paths
        if: always()
        run: |
          set -euo pipefail
          # Repo-root SF: paths, as in frontend-tests. One file per package: the
          # gate reads them as separate reports, and a line counts as covered
          # when any report covers it.
          mkdir -p coverage-postgres
          for pkg in frontend/packages/core; do
            lcov_file="$pkg/coverage-postgres/lcov.info"
            if [ -f "$lcov_file" ]; then
              sed "s|^SF:|SF:${pkg}/|" "$lcov_file" > "coverage-postgres/$(basename "$pkg").lcov"
            else
              echo "::warning::No Postgres test coverage for $pkg."
            fi
          done

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-postgres
          path: coverage-postgres/*.lcov
          if-no-files-found: warn

      - name: Postgres logs
        if: failure()
        run: docker compose logs --tail=100 postgres

  # ---------------------------------------------------------------------------
  # Coverage summary
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage Report
    runs-on: ubuntu-24.04
    needs: [backend-tests]
    if: needs.backend-tests.result == 'success'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download coverage artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-backend

      - name: Summarize coverage
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: coverage-backend.xml
          badge: true
          format: markdown
          output: both
          hide_complexity: true

      - name: Print coverage summary
        run: cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Coverage gate  (diff-cover >= 80% on changed lines)
  # ---------------------------------------------------------------------------
  # Enforces coverage on *changed lines only* (not whole-project), so the gate
  # ratchets quality forward on new code without requiring a backfill. Reuses
  # the coverage-backend.xml (Cobertura) already produced by backend-tests, the
  # coverage-frontend.lcov (lcov) produced by frontend-tests and the
  # coverage-postgres/*.lcov produced by postgres-tests -- diff-cover reads
  # both formats natively.
  # Pattern adapted from the OpenHuman project's CI (tinyhumansai/openhuman).
  coverage-gate:
    name: Coverage Gate (diff-cover >= 80%)
    runs-on: ubuntu-24.04
    needs: [backend-tests, frontend-tests, postgres-tests]
    # Intentionally PR-only: diff-coverage compares changed lines against the PR
    # base branch, and the gate already runs before a PR can enter the merge
    # queue. On merge_group events github.base_ref is empty, so the compare-ref
    # logic below would have no base to diff against -- supporting it would need
    # github.event.merge_group.base_ref instead.
    if: always() && github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # diff-cover needs history for the merge-base with the PR base; a
          # shallow checkout silently breaks the comparison.
          fetch-depth: 0

      - name: Fetch PR base branch
        run: git fetch origin "${{ github.base_ref }}" --depth=200

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install diff-cover
        run: pip install 'diff-cover>=9.2.0'

      - name: Download backend coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-backend

      - name: Download frontend coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-frontend

      # The Postgres tests' coverage only adds covered lines, so when that job
      # uploaded none the gate runs without it: stricter, never laxer.
      - name: Download Postgres test coverage
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-postgres
          path: coverage-postgres

      - name: Enforce >= 80% backend coverage on changed lines
        run: |
          set -euo pipefail
          diff-cover coverage-backend.xml \
            --compare-branch="origin/${{ github.base_ref }}" \
            --fail-under=80 \
            --format markdown:diff-coverage-backend.md,html:diff-coverage-backend.html

      - name: Enforce >= 80% frontend coverage on changed lines
        if: success() || failure()
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Several reports: a line counts as covered when any of them covers it.
          diff-cover coverage-frontend.lcov coverage-postgres/*.lcov \
            --compare-branch="origin/${{ github.base_ref }}" \
            --exclude "**/*vitest.config.ts" \
            --exclude "**/next.config.js" \
            --fail-under=80 \
            --format markdown:diff-coverage-frontend.md,html:diff-coverage-frontend.html

      - name: Print diff-coverage summary
        if: always()
        run: |
          if [ -f diff-coverage-backend.md ]; then
            echo "### Backend Coverage" >> "$GITHUB_STEP_SUMMARY"
            cat diff-coverage-backend.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f diff-coverage-frontend.md ]; then
            echo "### Frontend Coverage" >> "$GITHUB_STEP_SUMMARY"
            cat diff-coverage-frontend.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diff-coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diff-coverage-report
          path: |
            diff-coverage-backend.md
            diff-coverage-backend.html
            diff-coverage-frontend.md
            diff-coverage-frontend.html
          retention-days: 14
          if-no-files-found: warn
